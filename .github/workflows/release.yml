# 发版：推送 v<版本> 标签（和 core/version/VERSION 一致，例如 v0.5.0）后打出全部安装包，
# 直接发布 GitHub Release（只有所有任务都成功、Mac 包通过公证才会走到这一步），并把中继镜像推到 ghcr.io。
# 说明文字是下载表格；这一版改了什么，发布后在网页上编辑补上。
# 桌面端和命令行会查这个仓库的最新正式版来提示更新（PORTIDE_UPDATE_REPO），所以要在公开的仓库里发版。
#
# macOS 包用 Developer ID 签名并提交苹果公证，需要仓库的这些 Secrets（缺了就退回临时签名并给出警告）：
#   MACOS_CERT_P12           "Developer ID Application" 证书连同私钥导出的 .p12，base64 编码
#   MACOS_CERT_PASSWORD      导出 .p12 时设的密码
#   NOTARY_API_KEY_P8        App Store Connect API 密钥（.p8 文件），base64 编码
#   NOTARY_API_KEY_ID        密钥 ID
#   NOTARY_API_ISSUER_ID     Issuer ID
# Windows 安装程序还没有代码签名。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 12.6.0
  NODE_VERSION: 22

jobs:
  version:
    name: Check the tag matches VERSION
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(tr -d '[:space:]' < core/version/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "标签 $GITHUB_REF_NAME 和 core/version/VERSION（$version）不一致" >&2
            exit 1
          fi

  linux-windows:
    name: Linux, Windows, CLI and relay packages
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 构建号是 git 提交数
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev nsis
      - name: Desktop packages
        env:
          PORTIDE_MAINTAINER: ${{ vars.PORTIDE_MAINTAINER }}
          PORTIDE_UPDATE_REPO: ${{ github.repository }}
        run: bash scripts/build-desktop.sh all
      - name: Command line and relay packages
        env:
          PORTIDE_UPDATE_REPO: ${{ github.repository }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
      # 中继镜像的构建上下文：两个架构的静态二进制。
      - name: Collect relay binaries
        run: |
          mkdir -p relay-image
          for arch in amd64 arm64; do
            mkdir -p "relay-image/linux-$arch"
            cp "dist/portide-relay-${{ needs.version.outputs.version }}-linux-$arch/portide-relay" "relay-image/linux-$arch/"
          done
          cp deploy/relay/Dockerfile.release relay-image/Dockerfile
      - uses: actions/upload-artifact@v4
        with:
          name: relay-image
          path: relay-image

  macos:
    name: macOS desktop (${{ matrix.arch }})
    needs: version
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, amd64] # Intel 版在 Apple 芯片上交叉编译
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: desktop/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      # 证书导入只给这次构建用的临时钥匙串，API 密钥写进临时目录；任务结束时一起删掉。
      - name: Set up signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::没有 MACOS_CERT_P12，这次的 macOS 包只做了临时签名，别的 Mac 打不开"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 里没有 Developer ID Application 证书"
            exit 1
          fi
          echo "PORTIDE_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_API_KEY_P8" ] && [ -n "$NOTARY_API_KEY_ID" ] && [ -n "$NOTARY_API_ISSUER_ID" ]; then
            printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "PORTIDE_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "PORTIDE_NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
              echo "PORTIDE_NOTARY_ISSUER=$NOTARY_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::没有配齐 NOTARY_API_KEY_P8 / NOTARY_API_KEY_ID / NOTARY_API_ISSUER_ID，这次的 dmg 已签名但没有公证"
          fi
      - name: Build Portide.app and the dmg
        env:
          GOARCH: ${{ matrix.arch }}
          PORTIDE_UPDATE_REPO: ${{ github.repository }}
        run: bash scripts/build-desktop.sh mac
      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  relay-image:
    name: Relay image on ghcr.io
    needs: [version, linux-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-image
          path: relay-image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portide-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: relay-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=Portide relay
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  release:
    name: Publish GitHub release
    needs: [version, linux-windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "{linux-windows,macos-*}"
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        env:
          V: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS 11+, Apple silicon | \`portide-desktop-$V-macos-arm64.dmg\` |
          | macOS 11+, Intel | \`portide-desktop-$V-macos-amd64.dmg\` |
          | Windows 10 / 11 (x64) | \`portide-desktop-$V-windows-amd64-setup.exe\`, or the portable \`.zip\` |
          | Ubuntu / Debian (x86-64) | \`portide-desktop-$V-linux-amd64.deb\` |
          | Other Linux (x86-64) | \`portide-desktop-$V-linux-amd64.tar.gz\` |
          | Command line (\`portide\`) and relay (\`portide-relay\`) | the \`.tar.gz\` / \`.zip\` for your system |

          Relay as a Docker image: \`docker pull ghcr.io/$REPO-relay:$V\`

          Checksums for every file are in \`SHA256SUMS.txt\`.

          ## Good to know

          - The Mac app is signed and notarized by Apple.
          - The Windows installer isn't code-signed yet. If SmartScreen warns about an unknown publisher, click **More info › Run anyway**.
          - There's no official relay yet. To connect across networks, run your own: see the [relay guide](https://github.com/$REPO/blob/main/docs/en/relay.md).
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
          body_path: notes.md
          name: Portide ${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: assets/*
