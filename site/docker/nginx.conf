server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # /zh 补斜杠时用相对地址，否则会跳到容器内的 80 端口
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # 页面、样式、脚本、截图都会改：浏览器每次先问一下有没有变（没变返回 304，不重新下载），
    # 免得新页面配上缓存里的旧脚本和旧样式
    location ~* \.(html|css|js|jpg|png|svg)$ { add_header Cache-Control "no-cache"; }
}
