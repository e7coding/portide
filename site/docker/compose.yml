# 宣传站容器：nginx 直接提供 public/，改页面只需重新同步 public/，不用重建或重启。
# 部署目录里的布局：compose.yml、nginx.conf、public/
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORTIDE_SITE_PORT:-8030}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
